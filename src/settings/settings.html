<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Huh? — Settings</title>
  <link rel="stylesheet" href="../shared/theme.css" />
  <link rel="stylesheet" href="settings.css" />
</head>
<body>
  <main class="container">
    <header>
      <span class="huh-logo">
        <span class="mark" aria-hidden="true"></span>
        <span>Huh? Settings</span>
      </span>
      <p class="subtitle">Your key and history live on this device only — nothing leaves your browser.</p>
    </header>

    <section class="card">
      <div class="card-header">
        <h2>Gemini API key</h2>
        <span class="badge">required</span>
      </div>
      <p class="hint">
        Get a free key at
        <a href="https://aistudio.google.com/app/apikey" target="_blank" rel="noopener">aistudio.google.com</a>,
        then paste it below.
      </p>
      <div class="row">
        <input id="apiKey" type="password" placeholder="Paste your Gemini API key" autocomplete="off" spellcheck="false" />
        <button id="toggleVisibility" type="button" class="ghost">Show</button>
      </div>
      <div class="row">
        <button id="save" class="primary" type="button">Save key</button>
        <span id="status" class="status" aria-live="polite"></span>
      </div>
    </section>

    <section class="card">
      <div class="card-header">
        <h2>History</h2>
      </div>
      <label class="switch">
        <input id="historyEnabled" type="checkbox" />
        <span class="switch-track"><span class="switch-thumb"></span></span>
        <span class="switch-label">Remember what I've looked up <span class="muted">(last 5)</span></span>
      </label>
      <p class="hint">Stored locally on this device. Never transmitted.</p>
      <button id="clearHistory" class="danger" type="button">Clear history</button>
    </section>

    <footer class="footer">
      Built with too much coffee and not enough sleep. ☕
    </footer>
  </main>
  <script src="../dev/chrome-stub.js"></script>
  <script type="module" src="settings.js"></script>
</body>
</html>
