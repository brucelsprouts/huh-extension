<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>huh?</title>
  <link rel="icon" href="../../icons/icon16.png" />
  <link rel="stylesheet" href="../shared/theme.css" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <div class="brand">
      <img class="logo" src="../../icons/logo.png" alt="" aria-hidden="true" />
      <div class="brand-text">
        <h1>huh?</h1>
        <p class="subtitle">say it like i'm five</p>
      </div>
    </div>
    <div class="header-actions">
      <button id="openPage" class="ghost" type="button" title="open in tab">↗ open</button>
      <button id="openSettings" class="ghost" type="button">⚙ settings</button>
    </div>
  </header>

  <section id="pasteSection">
    <textarea id="pasteInput" rows="5" placeholder="// paste text to explain"></textarea>
    <button id="explainBtn" class="primary" type="button">
      <span class="btn-label">explain →</span>
      <span class="huh-loading" id="explainLoader" hidden><span></span><span></span><span></span></span>
    </button>
    <p id="inlineError" class="inline-error" hidden></p>
    <div class="inline-error-actions" id="inlineErrorActions" hidden>
      <button id="errorSettingsBtn" class="ghost" type="button">⚙ open settings</button>
    </div>
  </section>

  <section id="resultSection" hidden>
    <div id="result" class="result"></div>
    <div class="actions">
      <button id="simplerBtn" class="ghost" type="button">↓ simpler</button>
      <button id="copyBtn" class="ghost" type="button">⧉ copy</button>
      <button id="backBtn" class="ghost" type="button">← new</button>
      <span id="copyStatus" class="status" aria-live="polite"></span>
    </div>
  </section>

  <section id="historySection" hidden>
    <div class="section-label">// recent</div>
    <ul id="historyList" class="history"></ul>
  </section>

  <script src="../dev/chrome-stub.js"></script>
  <script type="module" src="popup.js"></script>
</body>
</html>
